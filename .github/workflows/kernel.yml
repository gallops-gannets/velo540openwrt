name: kernel-build
on:
  workflow_dispatch:
  push:
    branches: [kernel]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
      - name: deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext \
            git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd
      - name: build
        id: build
        run: |
          mkdir -p out
          set -o pipefail
          ./scripts/kernel-build.sh 2>&1 | tee out/kernel-build.log | grep -vE "^(  CC|  LD|  AR|  AS|  HOSTCC|  GEN|  CHK|  UPD|  MODPOST)" | tail -n 4000
      - name: release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="kernel-${{ github.run_number }}"
          status="${{ steps.build.outcome }}"
          gzip -9 out/kernel-build.log || true
          gh release create "$tag" --title "$tag ($status) ${{ github.sha }}" \
            --notes "Full OpenWrt build with in-tree patches (igb, mdio-gpio, xhci) of $GITHUB_SHA, status: $status." \
            out/* || gh release upload "$tag" out/* --clobber
